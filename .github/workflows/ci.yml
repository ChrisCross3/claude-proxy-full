name: CI

# Build and full test suite on every push and pull request to main.
# Runs on both runner OSes on purpose: 8 of the 584 tests are POSIX-only
# (mode bits via process.getuid, plus the sqlite3 CLI) and skip themselves on
# Windows. The operator host is Windows, the deploy target is Linux — a
# single-OS matrix would leave one of the two unverified.
#
# No secrets and no live Anthropic calls: the suite is credential-free by
# design (verified 2026-08-22 against a sanitized HOME with no token set).
# Anything that needs credentials belongs in `npm run verify:live`, not here.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # Both legs must report: a Windows-only failure is a real finding, not a
      # reason to lose the Linux result (and vice versa).
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      # SHA-gepinnt wie release.yml. Hier ginge auch ein Tag -- der Workflow
      # sieht kein Secret --, aber zwei Schreibweisen fuer dieselbe Sache im
      # selben Verzeichnis kosten mehr, als sie sparen.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 24 ist die Active LTS (EOL 2028-04-30); 22 ist seit 2025-10-21 nur
      # noch Maintenance. Diese Datei zieht zuerst, release.yml folgt erst,
      # wenn hier gruen steht -- dort haengen `contents: write` und NPM_TOKEN.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `tsc` type-checks while it emits, so this step is also the type check.
      # A separate `tsc --noEmit` run would compile the same sources twice.
      - name: Build
        run: npm run build

      # Runs against dist/, so it depends on the Build step above.
      - name: Test
        run: npm test
