name: Release package

# Diese Datei ist der Weg, auf dem das veroeffentlichte Paket entsteht: sie hat
# `contents: write` und sieht `NPM_TOKEN`. Deshalb gelten hier zwei Regeln, die
# fuer ci.yml bewusst NICHT gelten (dort gibt es nichts zu stehlen):
#
#   1. Actions sind auf den vollen Commit-SHA gepinnt, nicht auf ein Tag. Ein
#      Tag ist beweglich -- im tj-actions/changed-files-Vorfall vom Maerz 2025
#      wurde genau das ausgenutzt: bösartiger Code hinter ein bestehendes Tag
#      geschoben, ueber 23.000 Repos liefen ihn und gaben ihre CI-Secrets preis.
#      Ein SHA ist unveraenderlich. GitHubs eigener Haertungsleitfaden nennt das
#      "the only way to use an action as an immutable release".
#      Der Klartext-Kommentar hinter dem SHA ist die einzige Stelle, an der die
#      Version noch lesbar ist -- er gehoert beim Anheben mitgezogen.
#
#   2. Node ist auf eine unterstuetzte LTS gepinnt, und zwar auf dieselbe, auf
#      der ci.yml die Suite gruen sieht -- was hier gebaut wird, ist damit auf
#      genau der Runtime geprueft, auf der es gebaut wird. Node 20 stand hier
#      bis 2026-09-05 und war seit 2026-04-30 EOL (nodejs/Release
#      schedule.json); ueber 22 ging es am 2026-09-06 auf 24 (Active LTS, EOL
#      2028-04-30), nachdem der CI-Lauf d02384e beide Runner-Betriebssysteme
#      gruen gemeldet hat: ubuntu 595/595/0/0, windows 595/587/0/8.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  package:
    name: Build and upload release package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Pack npm tarball
        run: |
          mkdir -p release-assets
          npm pack --pack-destination release-assets
          cd release-assets
          asset="$(ls *.tgz)"
          shasum -a 256 "$asset" > "$asset.sha256"

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber

      # setup-node v7 hat den Dummy-Export von NODE_AUTH_TOKEN entfernt. Fuer
      # diesen Schritt ist das eine Verbesserung: die -z-Pruefung unten war mit
      # dem Dummy blind, die Variable war auch ohne NPM_TOKEN nicht leer.
      - name: Publish to npm when NPM_TOKEN is configured
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is not configured; skipping npm publish."
            exit 0
          fi
          npm publish --access public
